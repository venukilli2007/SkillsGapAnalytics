<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | SkillsGapAnalytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 42px;

            background: linear-gradient(
                135deg,
                #1677ff,
                #774cff
            );

            box-shadow:
                0 10px 35px rgba(80,100,255,0.35);
        }

        .profile-form {
            max-width: 700px;
            margin: auto;
        }

        .profile-section {
            padding: 28px;

            border-radius: 20px;

            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.11);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.25);
        }

        .profile-section h2 {
            margin-top: 0;
        }

        .profile-section p {
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <nav class="top-nav">

        <div class="logo">
            SkillsGapAnalytics
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('profile') }}">
                Profile
            </a>

            <a href="{{ url_for('skills') }}">
                My Skills
            </a>

            <a href="{{ url_for('skill_gap_results') }}">
                Results
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <div class="profile-header">

        <div class="profile-icon">
            👤
        </div>

        <h1>My Profile</h1>

        <p>
            Tell us about yourself and your career goals.
        </p>

    </div>


    <div class="profile-section">

        <h2>Professional Information</h2>

        <p>
            Keep your information updated to build your
            professional skill profile.
        </p>


        <form
            class="profile-form"
            method="POST"
            action="/profile"
        >

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>College</label>

            <input
                type="text"
                name="college"
                placeholder="Enter your college name"
                required
            >


            <label>Course</label>

            <input
                type="text"
                name="course"
                placeholder="Example: B.Tech Computer Science"
                required
            >


            <label>Career Goal</label>

            <input
                type="text"
                name="career_goal"
                placeholder="Example: Full Stack Developer"
                required
            >


            <button type="submit">
                Save Profile →
            </button>

        </form>

    </div>


    <div class="page-nav">

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</div>

</body>
</html>
