<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SkillsGapAnalytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 45px 40px;
            border-radius: 25px;

            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.13);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;

            background: linear-gradient(90deg,#4facfe,#a66cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-button {
            width: 100%;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            SkillsGapAnalytics
        </div>

        <h1 class="auth-title">
            Create Account
        </h1>

        <p class="auth-subtitle">
            Start building your professional skill profile.
        </p>

        <form method="POST" action="/register">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button class="auth-button" type="submit">
                Create Account →
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('home') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
